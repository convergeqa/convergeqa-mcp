[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convergeqa-mcp"
version = "0.2.0"
description = "Stdio MCP servers for ConvergeQA review workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "ConvergeQA" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
convergeqa-mcp = "convergeqa_mcp.dispatch:main"
convergeqa-mcp-reviews = "convergeqa_mcp.service_account_reviews_mcp:main"
convergeqa-mcp-compare = "convergeqa_mcp.compare_due_diligence_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/convergeqa_mcp"]
